<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宫廷恋歌 · 乙女游戏demo</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
body {
    font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background: #0a0a14;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: #fff;
    overflow: hidden;
}
.game-wrap {
    max-width: 720px;
    width: 100%;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    border: 2px solid #3a2a4a;
}
/* ===== 场景（背景） ===== */
.scene {
    position: relative;
    width: 100%;
    height: 420px;
    background: linear-gradient(180deg, #1a1a3e 0%, #2a1a3e 40%, #3a1a2e 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: background 1s;
}
.scene.palace { background: linear-gradient(180deg,#2a1a3e 0%,#3a1a2e 50%,#4a1a2e 100%); }
.scene.garden { background: linear-gradient(180deg,#1a3e2a 0%,#1a2e3e 60%,#0a1a2e 100%); }
.scene.night { background: linear-gradient(180deg,#0a0a2e 0%,#1a0a2e 60%,#0a0a1a 100%); }

/* 月亮/装饰 */
.moon {
    position: absolute;
    top: 40px;
    right: 60px;
    width: 60px;
    height: 60px;
    background: radial-gradient(circle at 35% 35%, #fff8e0, #f0d080);
    border-radius: 50%;
    box-shadow: 0 0 40px #f0d08088, 0 0 80px #f0d08044;
}
.stars {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(2px 2px at 20% 30%, #fff, transparent),
                      radial-gradient(1px 1px at 60% 15%, #fff, transparent),
                      radial-gradient(1.5px 1.5px at 80% 40%, #fff, transparent),
                      radial-gradient(1px 1px at 40% 60%, #fff, transparent);
    opacity: 0.6;
    animation: twinkle 3s infinite alternate;
}
@keyframes twinkle { from { opacity: 0.4; } to { opacity: 0.8; } }

/* ===== 角色立绘（用emoji+圆形背景模拟） ===== */
.character {
    position: relative;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
    background: radial-gradient(circle at 40% 30%, #ffffff20, #00000040);
    border: 3px solid #ffffff30;
    box-shadow: 0 10px 40px #00000060;
    transition: all 0.4s;
    animation: breathe 3s infinite ease-in-out;
}
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.character.hidden { opacity: 0; transform: scale(0.5); }

/* ===== 对话框 ===== */
.dialogue-box {
    background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
    padding: 24px 28px;
    min-height: 160px;
    border-top: 2px solid #e94560;
    position: relative;
}
.speaker {
    font-size: 1.1rem;
    font-weight: 700;
    color: #f5a623;
    margin-bottom: 10px;
    letter-spacing: 2px;
}
.dialogue-text {
    font-size: 1rem;
    line-height: 1.8;
    color: #e0e0f0;
    margin-bottom: 20px;
    min-height: 50px;
}
.options {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.option-btn {
    background: #1e1e36;
    border: 1.5px solid #3a3a5a;
    border-radius: 12px;
    padding: 12px 18px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.95rem;
    color: #d0d0e0;
    text-align: left;
}
.option-btn:hover {
    border-color: #e94560;
    background: #2a1a30;
    color: #fff;
    transform: translateX(6px);
}
.option-btn:active { transform: translateX(2px) scale(0.98); }

/* 好感度显示 */
.affection-bar {
    position: absolute;
    top: 16px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: #ffffffaa;
    pointer-events: none;
}
.aff-item { display: flex; align-items: center; gap: 6px; }
.aff-heart { color: #e94560; }

/* 标题/开始界面 */
.title-screen {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #0a0a1e 0%, #1a0a2e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 10;
    transition: opacity 0.8s;
}
.title-screen.hide { opacity: 0; pointer-events: none; }
.title-screen h1 {
    font-size: 2.4rem;
    background: linear-gradient(90deg, #f5a623, #e94560);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 6px;
}
.title-screen p { color: #8a8aa3; font-size: 0.9rem; }
.start-btn {
    background: linear-gradient(135deg, #e94560, #c7304a);
    border: none;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 14px 50px;
    border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 8px 24px #e9456055;
    transition: all 0.2s;
    letter-spacing: 3px;
}
.start-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px #e9456088; }

/* 结局画面 */
.ending-screen {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #1a0a1e 0%, #0a0a1e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 10;
    padding: 40px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s;
}
.ending-screen.show { opacity: 1; pointer-events: all; }
.ending-screen h2 { font-size: 2rem; color: #f5a623; letter-spacing: 4px; }
.ending-screen .end-person { font-size: 1.4rem; color: #e94560; }
.ending-screen .end-text { font-size: 1rem; line-height: 1.8; color: #c8c8d8; max-width: 500px; }
.ending-screen .end-heart { font-size: 3rem; margin: 10px 0; animation: heartbeat 1.2s infinite; }
@keyframes heartbeat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
</style>
</head>
<body>
<div class="game-wrap">
    <div class="scene palace" id="scene">
        <div class="stars" id="stars"></div>
        <div class="moon" id="moon"></div>
        <div class="character" id="character">👑</div>

        <!-- 好感度条 -->
        <div class="affection-bar" id="affectionBar" style="display:none;">
            <div class="aff-item"><span class="aff-heart">❤</span> 王爷 <span id="aff1">0</span></div>
            <div class="aff-item"><span class="aff-heart">❤</span> 将军 <span id="aff2">0</span></div>
            <div class="aff-item"><span class="aff-heart">❤</span> 公子 <span id="aff3">0</span></div>
        </div>

        <!-- 标题画面 -->
        <div class="title-screen" id="titleScreen">
            <h1>宫廷恋歌</h1>
            <p>—— 一个关于选择与心动的故事 ——</p>
            <button class="start-btn" onclick="startGame()">开 始 游 戏</button>
        </div>

        <!-- 结局画面 -->
        <div class="ending-screen" id="endingScreen">
            <div class="end-heart" id="endHeart">💕</div>
            <h2 id="endTitle"></h2>
            <div class="end-person" id="endPerson"></div>
            <div class="end-text" id="endText"></div>
            <button class="start-btn" style="margin-top:20px;" onclick="restart()">再玩一次</button>
        </div>
    </div>

    <!-- 对话框 -->
    <div class="dialogue-box">
        <div class="speaker" id="speaker">旁白</div>
        <div class="dialogue-text" id="dialogueText"></div>
        <div class="options" id="optionsArea"></div>
    </div>
</div>

<script>
// ===================== 声音系统（Web Audio 代码合成，无需音频文件）=====================
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
// 播放点击音效
function playClick() {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
}
// 播放心动音效
function playHeart() {
    initAudio();
    [523, 659, 784].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.1);
        gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + i * 0.1 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.3);
        osc.start(audioCtx.currentTime + i * 0.1);
        osc.stop(audioCtx.currentTime + i * 0.1 + 0.3);
    });
}
// 播放结局音效
function playEnding() {
    initAudio();
    [392, 523, 659, 784, 1046].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.15);
        gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + i * 0.15 + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.15 + 0.5);
        osc.start(audioCtx.currentTime + i * 0.15);
        osc.stop(audioCtx.currentTime + i * 0.15 + 0.5);
    });
}

// ===================== 游戏数据 =====================
// 好感度
let affection = { prince: 0, general: 0, scholar: 0 };

// 当前剧情节点
let currentNode = null;

// 剧情树（每个节点包含：说话人、台词、角色立绘、场景、选项）
const story = {
    // ========== 开局 ==========
    start: {
        speaker: "旁白",
        text: "春日的长安城，花开满城。你是尚书府的千金，今日随父亲入宫赴宴。",
        character: "🌸",
        scene: "palace",
        next: "meet_prince"
    },
    meet_prince: {
        speaker: "旁白",
        text: "宴席上，一位身着玄衣的男子向你走来。他眉眼含笑，气度不凡。",
        character: "👑",
        scene: "palace",
        next: "prince_intro"
    },
    prince_intro: {
        speaker: "神秘男子",
        text: "“姑娘可是尚书府的千金？久仰大名。”",
        character: "👑",
        scene: "palace",
        options: [
            { text: "礼貌回礼：“公子过奖了。”", effect: { prince: 1 }, next: "prince_like" },
            { text: "淡淡一笑，不置可否。", effect: { prince: -1 }, next: "prince_cold" },
            { text: "好奇地问：“公子是？”", effect: { prince: 2 }, next: "prince_curious" }
        ]
    },
    prince_like: {
        speaker: "神秘男子",
        text: "“姑娘知书达理，果然名不虚传。”他眼中闪过一丝欣赏。",
        character: "👑",
        scene: "palace",
        next: "general_appear"
    },
    prince_cold: {
        speaker: "神秘男子",
        text: "他微微一愣，随即笑道：“姑娘倒是特别。”",
        character: "👑",
        scene: "palace",
        next: "general_appear"
    },
    prince_curious: {
        speaker: "神秘男子",
        text: "“在下…是当朝王爷。”他压低声音，“不过今日，我只想做个普通人。”",
        character: "👑",
        scene: "palace",
        next: "general_appear"
    },

    // ========== 将军出场 ==========
    general_appear: {
        speaker: "旁白",
        text: "忽然，一阵急促的脚步声传来。一位身披铠甲的将军大步走入，目光如炬。",
        character: "⚔️",
        scene: "palace",
        next: "general_intro"
    },
    general_intro: {
        speaker: "将军",
        text: "“王爷，边境急报！”他看了你一眼，微微颔首，“这位是？”",
        character: "⚔️",
        scene: "palace",
        options: [
            { text: "主动自我介绍", effect: { general: 2 }, next: "general_like" },
            { text: "安静地站在一旁", effect: { general: 0 }, next: "general_neutral" },
            { text: "好奇地打量将军", effect: { general: 1 }, next: "general_curious" }
        ]
    },
    general_like: {
        speaker: "将军",
        text: "“尚书府的千金？果然气质不凡。”他难得露出笑容。",
        character: "⚔️",
        scene: "palace",
        next: "scholar_appear"
    },
    general_neutral: {
        speaker: "将军",
        text: "他点点头，没有多说什么，转身向王爷禀报军情。",
        character: "⚔️",
        scene: "palace",
        next: "scholar_appear"
    },
    general_curious: {
        speaker: "将军",
        text: "他注意到你的目光，耳根微微泛红：“姑……姑娘为何这样看我？”",
        character: "⚔️",
        scene: "palace",
        next: "scholar_appear"
    },

    // ========== 公子出场 ==========
    scholar_appear: {
        speaker: "旁白",
        text: "宴席散后，你独自在御花园散步。月光下，一位白衣公子正在抚琴。",
        character: "🎋",
        scene: "garden",
        next: "scholar_intro"
    },
    scholar_intro: {
        speaker: "白衣公子",
        text: "琴声戛然而止。他抬头看你，眼中带着几分惊讶：“姑娘也懂音律？”",
        character: "🎋",
        scene: "garden",
        options: [
            { text: "“略懂一二，公子的琴声动人。”", effect: { scholar: 2 }, next: "scholar_like" },
            { text: "“不懂，只是觉得好听。”", effect: { scholar: 1 }, next: "scholar_honest" },
            { text: "“公子深夜在此，不怕被人看见？”", effect: { scholar: -1 }, next: "scholar_wary" }
        ]
    },
    scholar_like: {
        speaker: "白衣公子",
        text: "他眼睛一亮：“难得遇到知音。姑娘若不嫌弃，我为你弹一曲。”",
        character: "🎋",
        scene: "garden",
        next: "final_choice"
    },
    scholar_honest: {
        speaker: "白衣公子",
        text: "他笑了：“姑娘坦诚，比那些附庸风雅的人可爱多了。”",
        character: "🎋",
        scene: "garden",
        next: "final_choice"
    },
    scholar_wary: {
        speaker: "白衣公子",
        text: "他收起琴，神色微冷：“姑娘多虑了，我只是路过。”",
        character: "🎋",
        scene: "garden",
        next: "final_choice"
    },

    // ========== 最终选择 ==========
    final_choice: {
        speaker: "旁白",
        text: "夜深了，你必须回府了。临走前，你回头看了一眼——王爷、将军、公子，都在望着你。",
        character: "🌙",
        scene: "night",
        options: [
            { text: "❤ 走向王爷", effect: { prince: 3 }, next: "ending_prince" },
            { text: "❤ 走向将军", effect: { general: 3 }, next: "ending_general" },
            { text: "❤ 走向公子", effect: { scholar: 3 }, next: "ending_scholar" }
        ]
    },

    // ========== 结局 ==========
    ending_prince: {
        speaker: "旁白",
        text: "你走向王爷。他微微一笑，牵起你的手：“从今往后，本王护你一世周全。”",
        character: "👑",
        scene: "palace",
        ending: "prince"
    },
    ending_general: {
        speaker: "旁白",
        text: "你走向将军。他愣了一秒，随即挺直脊背：“我……我不会说话，但我会用一生守护你。”",
        character: "⚔️",
        scene: "palace",
        ending: "general"
    },
    ending_scholar: {
        speaker: "旁白",
        text: "你走向公子。他轻轻握住你的手：“愿为你抚琴一生，不问红尘。”",
        character: "🎋",
        scene: "garden",
        ending: "scholar"
    }
};

// ===================== 游戏控制 =====================
const sceneEl = document.getElementById('scene');
const characterEl = document.getElementById('character');
const speakerEl = document.getElementById('speaker');
const dialogueTextEl = document.getElementById('dialogueText');
const optionsArea = document.getElementById('optionsArea');
const titleScreen = document.getElementById('titleScreen');
const endingScreen = document.getElementById('endingScreen');
const affectionBar = document.getElementById('affectionBar');

function startGame() {
    initAudio();
    playClick();
    titleScreen.classList.add('hide');
    affectionBar.style.display = 'flex';
    affection = { prince: 0, general: 0, scholar: 0 };
    updateAffection();
    showNode('start');
}

function showNode(nodeId) {
    const node = story[nodeId];
    if (!node) return;
    currentNode = node;

    // 更新场景
    sceneEl.className = 'scene ' + (node.scene || 'palace');
    // 更新角色
    characterEl.textContent = node.character || '👤';
    // 更新说话人
    speakerEl.textContent = node.speaker || '旁白';
    // 更新台词
    dialogueTextEl.textContent = node.text || '';
    // 清空选项
    optionsArea.innerHTML = '';

    // 如果有选项
    if (node.options) {
        node.options.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.textContent = opt.text;
            btn.onclick = () => {
                playClick();
                // 应用好感度变化
                if (opt.effect) {
                    for (let key in opt.effect) {
                        affection[key] += opt.effect[key];
                    }
                    updateAffection();
                }
                // 播放心动音效（如果好感度上升）
                if (opt.effect && Object.values(opt.effect).some(v => v > 0)) {
                    setTimeout(playHeart, 100);
                }
                showNode(opt.next);
            };
            optionsArea.appendChild(btn);
        });
    } else if (node.ending) {
        // 结局
        setTimeout(() => showEnding(node.ending), 800);
    } else if (node.next) {
        // 自动继续
        const btn = document.createElement('div');
        btn.className = 'option-btn';
        btn.textContent = '▶ 继续';
        btn.onclick = () => {
            playClick();
            showNode(node.next);
        };
        optionsArea.appendChild(btn);
    }
}

function updateAffection() {
    document.getElementById('aff1').textContent = affection.prince;
    document.getElementById('aff2').textContent = affection.general;
    document.getElementById('aff3').textContent = affection.scholar;
}

function showEnding(who) {
    playEnding();
    const endings = {
        prince: { title: "👑 王爷线结局", person: "「本王护你一世周全」", text: "你与王爷相知相守，他为你放弃争权夺位，与你归隐山林，从此不问朝堂。" },
        general: { title: "⚔️ 将军线结局", person: "「我会用一生守护你」", text: "将军为你卸甲归田，在边关小镇与你开了一间茶铺，日出而作，日落而息。" },
        scholar: { title: "🎋 公子线结局", person: "「愿为你抚琴一生」", text: "你与公子泛舟江湖，他抚琴，你作诗，逍遥自在，成为一段佳话。" }
    };
    const e = endings[who];
    document.getElementById('endTitle').textContent = e.title;
    document.getElementById('endPerson').textContent = e.person;
    document.getElementById('endText').textContent = e.text;
    document.getElementById('endHeart').textContent = who === 'prince' ? '👑' : who === 'general' ? '⚔️' : '🎋';
    endingScreen.classList.add('show');
}

function restart() {
    playClick();
    endingScreen.classList.remove('show');
    titleScreen.classList.remove('hide');
    affectionBar.style.display = 'none';
    affection = { prince: 0, general: 0, scholar: 0 };
    updateAffection();
    characterEl.textContent = '👑';
    sceneEl.className = 'scene palace';
    speakerEl.textContent = '旁白';
    dialogueTextEl.textContent = '';
    optionsArea.innerHTML = '';
}
</script>
</body>
</html>
