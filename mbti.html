// ===================== 游戏状态 =====================
let gender = 'male';
let currentPath = '';
let currentQuestionIndex = 0;
let questionList = [];
let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
let choiceCount = { A: 0, B: 0, C: 0, D: 0 };

const startScreen = document.getElementById('startScreen');
const questionScreen = document.getElementById('questionScreen');
const resultArea = document.getElementById('resultArea');
const progressFill = document.getElementById('progressFill');
const storyText = document.getElementById('storyText');
const questionText = document.getElementById('questionText');
const optionsArea = document.getElementById('optionsArea');
const mainFooter = document.getElementById('mainFooter');

// ===================== 选择性别 =====================
function selectGender(g) {
    gender = g;
    startScreen.style.display = 'none';
    questionScreen.style.display = 'block';
    resultArea.classList.remove('show');
    mainFooter.style.display = 'none';
    currentQuestionIndex = 0;
    scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    choiceCount = { A: 0, B: 0, C: 0, D: 0 };
    currentPath = '';
    showPathSelection();
}

// ===================== 选择身份 =====================
function showPathSelection() {
    const paths = PATHS[gender];
    const pathList = Object.keys(paths);
    
    storyText.textContent = "你睁开眼，发现自己身处一个腐朽的王朝。系统提示：【请选择你的初始身份】";
    questionText.innerHTML = `<span class="num">Q1.</span> 你决定以什么身份开局？`;
    optionsArea.innerHTML = '';
    
    pathList.forEach((key, idx) => {
        const p = paths[key];
        const div = document.createElement('div');
        div.className = 'option';
        div.innerHTML = `${String.fromCharCode(65 + idx)}. ${p.emoji} ${p.name} —— ${
            gender === 'male' ? 
            (key === 'emperor' ? '名义上权力最大，但朝堂之上全是老狐狸' :
             key === 'eunuch' ? '深宫之内，最接近权力也最危险' :
             key === 'corrupt' ? '浑水摸鱼，先捞一笔再说' :
             key === 'honest' ? '两袖清风，但处处碰壁' :
             '跳出红尘，但天下没有清净地') :
            (key === 'empress' ? '名义上权力最大，但朝堂之上全是老狐狸' :
             key === 'maid' ? '深宫之内，最接近权力也最危险' :
             key === 'concubine' ? '靠宠爱活着，贪的是情，也是势' :
             key === 'swordswoman' ? '两袖清风，但处处碰壁' :
             '上知天文下知地理，皇帝也要敬你三分')
        }`;
        div.onclick = () => {
            currentPath = key;
            currentQuestionIndex = 0;
            const pathQuestions = QUESTIONS[gender][key];
            questionList = [...pathQuestions, FINAL_QUESTION];
            questionScreen.style.display = 'block';
            resultArea.classList.remove('show');
            renderQuestion();
        };
        optionsArea.appendChild(div);
    });
    
    progressFill.style.width = '0%';
}

// ===================== 渲染题目 =====================
function renderQuestion() {
    if (currentQuestionIndex >= questionList.length) {
        showResult();
        return;
    }

    const q = questionList[currentQuestionIndex];
    storyText.textContent = q.story || '';
    questionText.innerHTML = `<span class="num">Q${currentQuestionIndex + 2}.</span> ${q.q}`;

    optionsArea.innerHTML = '';
    q.options.forEach((opt, idx) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.textContent = `${String.fromCharCode(65 + idx)}. ${opt.text}`;
        div.onclick = () => selectOption(opt, div);
        optionsArea.appendChild(div);
    });

    const progress = ((currentQuestionIndex + 1) / (questionList.length + 1)) * 100;
    progressFill.style.width = progress + '%';
}

// ===================== 选择选项 =====================
function selectOption(opt, el) {
    if (el.classList.contains('selected')) return;
    el.classList.add('selected');

    for (let key in opt.score) {
        if (scores[key] !== undefined) {
            scores[key] += opt.score[key];
        }
    }
    
    if (opt.choice) {
        choiceCount[opt.choice]++;
    }

    setTimeout(() => {
        currentQuestionIndex++;
        renderQuestion();
    }, 250);
}

// ===================== 显示结果 =====================
function showResult() {
    questionScreen.style.display = 'none';
    resultArea.classList.add('show');
    progressFill.style.width = '100%';

    const type = [
        scores.E >= scores.I ? 'E' : 'I',
        scores.S >= scores.N ? 'S' : 'N',
        scores.T >= scores.F ? 'T' : 'F',
        scores.J >= scores.P ? 'J' : 'P'
    ].join('');

    const pool = gender === 'male' ? MALE : FEMALE;
    const p = pool[type] || pool.INTJ;

    document.getElementById('resultType').textContent = type;
    document.getElementById('resultPerson').textContent = '你像 ' + p.person;
    document.getElementById('resultGenderTag').textContent = gender === 'female' ? '♀ 女性历史人物' : '♂ 男性历史人物';
    document.getElementById('resultQuote').textContent = '“' + p.quote + '”';
    document.getElementById('resultDesc').textContent = p.desc;

    // 计算结局
    let maxChoice = 'A';
    let maxCount = choiceCount.A;
    for (let c of ['B', 'C', 'D']) {
        if (choiceCount[c] > maxCount) {
            maxCount = choiceCount[c];
            maxChoice = c;
        }
    }
    const ending = ENDINGS[gender][currentPath][maxChoice];
    document.getElementById('resultEnding').innerHTML = 
        `<div class="ending-title">🏆 你的专属结局：${ending.title}</div>${ending.desc}`;
}

// ===================== 重新开始 =====================
function restart() {
    currentQuestionIndex = 0;
    scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    choiceCount = { A: 0, B: 0, C: 0, D: 0 };
    currentPath = '';
    startScreen.style.display = 'block';
    questionScreen.style.display = 'none';
    resultArea.classList.remove('show');
    progressFill.style.width = '0%';
    mainFooter.style.display = 'block';
}
</script>
